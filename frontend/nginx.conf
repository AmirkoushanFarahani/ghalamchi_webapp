log_format azari_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
  access_log /dev/stdout azari_safe;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;
  autoindex off;

  # Never serve project internals or backup artifacts, even after an accidental copy.
  location ~ (^|/)\. { return 404; }
  location ~* \.(?:map|sql|dump|bak|log|env|ini|toml|ya?ml|py|sqlite3?|db)$ { return 404; }
  location ~* ^/(?:backups?|backend|scripts|security|node_modules)(?:/|$) { return 404; }

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Keep the browser on one local origin. Nginx reaches the API over Docker's
  # internal network, so a browser never needs to access a separately mapped API port.
  location /api/v1/ {
    proxy_pass http://backend:8000/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
